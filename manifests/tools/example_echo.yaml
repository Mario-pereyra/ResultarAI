id: example_echo
name: Echo de Ejemplo
status: active
version: 1.0.0

type: mcp_tool
adapter: mcp

mcp:
  server: example_utilities_server
  tool_name: echo
  spec_revision: "2025-11-25"
  endpoint_ref: example_mcp_endpoint

risk:
  level: low
  operation_type: read

permissions:
  mode: read_only
  requires_human_approval: false

security:
  allow_sql_freeform: false
  allow_dynamic_table_access: false
  mask_sensitive_fields: true

audit:
  log_request: true
  log_response_summary: true
  log_user: true
  log_tenant: true

evals:
  status: placeholder
  template: example_echo_eval
