id: report_formatting
name: Formato de Informes
status: active
version: 1.0.0

description: >
  Skill de ejemplo de fábrica: formatea y estructura informes profesionales
  usando una plantilla estándar y reglas de estilo consistentes.

skill_package:
  spec: agent_skills
  ref: report-formatting
  path: skills/packages/report-formatting/SKILL.md
  version: 1.0.0

execution:
  mode: read_only
  graph: default_skill_graph
  requires_human_approval: false

visibility:
  roles:
    - admin
    - tecnico
    - funcional

risk:
  level: low

tools:
  - example_echo

output_policy:
  summarize_results: true
  mask_sensitive_fields: false
  max_rows: 50

evals:
  status: placeholder
  template: report_formatting_eval
