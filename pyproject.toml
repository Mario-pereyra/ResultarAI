[project]
name = "resultarai"
version = "0.1.0"
description = "Governed internal AI platform for Resultar Soluciones (TOTVS Bolivia partner)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6.0.3",
]

[project.scripts]
resultarai-validate = "resultarai.app.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "import-linter",
    "pre-commit",
    "types-pyyaml>=6.0.12.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resultarai"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["resultarai", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "PIE", # flake8-pie
    "TID", # flake8-tidy-imports
    "ANN", # flake8-annotations
]
ignore = [
    "ANN401", # allow Any in explicitly justified cases
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "ANN001"]

[tool.ruff.lint.isort]
known-first-party = ["resultarai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["resultarai", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.importlinter]
root_package = "resultarai"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El nucleo no conoce el mundo exterior"
type = "forbidden"
source_modules = ["resultarai.core"]
forbidden_modules = [
    "resultarai.adapters", "resultarai.app",
    "langgraph", "litellm", "langfuse", "fastapi", "httpx",
]

[[tool.importlinter.contracts]]
name = "Capas: app -> adapters -> core"
type = "layers"
layers = ["resultarai.app", "resultarai.adapters", "resultarai.core"]

[[tool.importlinter.contracts]]
name = "Adapters independientes entre si"
type = "independence"
modules = [
    "resultarai.adapters.llm_litellm",
    "resultarai.adapters.runtime_langgraph",
    "resultarai.adapters.tools_mcp",
    "resultarai.adapters.tools_openapi",
    "resultarai.adapters.tracing_langfuse",
    "resultarai.adapters.persistence_postgres",
]
