[project]
name = "resultarai"
version = "0.1.0"
description = "Governed internal AI platform for Resultar Soluciones (TOTVS Bolivia partner)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "import-linter",
    "pre-commit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resultarai"]
