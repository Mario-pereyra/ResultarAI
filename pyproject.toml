[project]
name = "resultarai"
version = "0.1.0"
description = "Governed internal AI platform for Resultar Soluciones (TOTVS Bolivia partner)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "uuid6>=2024.7.10",
    "litellm>=1.91.1",
    "langgraph>=1.2.8",
    "langfuse>=4.13.2",
    "mcp==1.28.1",
    "fastapi>=0.139.0",
    "argon2-cffi>=25.1.0",
    "itsdangerous>=2.2.0",
    "pyotp>=2.10.0",
    "cryptography>=49.0.0",
    "openpyxl>=3.1.5",
    "python-calamine>=0.7.0",
    "pypdf>=6.14.2",
    "mammoth>=1.12.0",
    "presidio-analyzer>=2.2.363",
    # Modelo spaCy de espanol para el escaneo N2 (PII) con Presidio (d14, tarea 5.2).
    # Wheel PINNEADO desde GitHub releases (no `spacy download`, que requiere egress libre
    # en runtime): la version es reproducible y sirve a instancias on-prem sin salida a
    # internet. `sm` (small, ~13 MB) alcanza para NER de PERSON + el realce por contexto
    # (lemmas) de los reconocedores propios ES/BO; compatible con el spacy resuelto (3.8.x).
    "es-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
resultarai-validate = "resultarai.app.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "import-linter",
    "pre-commit",
    "types-pyyaml>=6.0.12.20260518",
    "types-openpyxl>=3.1.5.20260518",
    "httpx>=0.28.1",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Requerido por la dependencia del modelo spaCy `es-core-news-sm`, que es una
# referencia directa (wheel pinneado por URL) en vez de un paquete de PyPI (d14,
# tarea 5.2): sin esto Hatchling rechaza construir la metadata del proyecto.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["resultarai"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["resultarai", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "C4",  # flake8-comprehensions
    "PT",  # flake8-pytest-style
    "PIE", # flake8-pie
    "TID", # flake8-tidy-imports
    "ANN", # flake8-annotations
]
ignore = [
    "ANN401", # allow Any in explicitly justified cases
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "ANN001"]

[tool.ruff.lint.isort]
known-first-party = ["resultarai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["resultarai", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# mammoth (extractor DOCX, d14) no publica stubs ni py.typed; el resto de las
# libs de extracción (pypdf, python-calamine, presidio-analyzer) sí tipan y
# openpyxl se cubre con types-openpyxl.
[[tool.mypy.overrides]]
module = ["mammoth", "mammoth.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.importlinter]
root_package = "resultarai"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El nucleo no conoce el mundo exterior"
type = "forbidden"
source_modules = ["resultarai.core"]
forbidden_modules = [
    "resultarai.adapters", "resultarai.app",
    "langgraph", "litellm", "langfuse", "fastapi", "httpx",
    "sqlalchemy", "alembic", "psycopg", "uuid6", "mcp",
    "openpyxl", "python_calamine", "pypdf", "mammoth", "presidio_analyzer",
]

[[tool.importlinter.contracts]]
name = "Capas: app -> adapters -> core"
type = "layers"
layers = ["resultarai.app", "resultarai.adapters", "resultarai.core"]

[[tool.importlinter.contracts]]
name = "Adapters independientes entre si"
type = "independence"
modules = [
    "resultarai.adapters.llm_litellm",
    "resultarai.adapters.runtime_langgraph",
    "resultarai.adapters.tools_mcp",
    "resultarai.adapters.tools_openapi",
    "resultarai.adapters.tracing_langfuse",
    "resultarai.adapters.persistence_postgres",
    "resultarai.adapters.skills_fs",
    "resultarai.adapters.extraction_spreadsheet",
    "resultarai.adapters.extraction_pdf",
    "resultarai.adapters.extraction_docx",
    "resultarai.adapters.extraction_text",
]
